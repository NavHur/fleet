# T3 starts agent sessions (claude, codex) in app-t3code-agents.slice under
# this slice. Weight 500: half of t3code.service (1000), five times each
# preview service (100); builds.slice runs in the idle class beneath them.
[Slice]
CPUWeight=500
# memory.low is hierarchical: the agents slice below needs the same floor.
MemoryLow=4G
