# Managed by fleet (hosts/homebox/zfs/etc/sanoid/sanoid.conf). Edit it there, then run bin/sync --apply.
[rpool/home/pedro]
  use_template = home
[rpool/home/pedro/cache]
  use_template = none
[rpool/ROOT/ubuntu]
  use_template = system
[rpool/var/log]
  use_template = none

[template_home]
  hourly = 24
  daily = 14
  monthly = 3
  autosnap = yes
  autoprune = yes

[template_system]
  hourly = 0
  daily = 7
  monthly = 2
  autosnap = yes
  autoprune = yes

[template_none]
  autosnap = no
  autoprune = no
