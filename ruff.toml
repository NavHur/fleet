# Lint only (`make lint`): pyflakes and syntax errors. Python here has no
# formatter, so leave layout alone. Every Mac script runs on its stock
# /usr/bin/python3 (3.9), so syntax newer than that is an error.
target-version = "py39"
# Extensionless Python entry points.
extend-include = ["bin/actions-runners", "bin/bg-job", "bin/host-check", "bin/idle-compact"]

[lint]
select = ["F", "E9", "FA"]
