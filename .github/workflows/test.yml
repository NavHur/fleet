name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # The skill's oxlint tests skip without its node_modules.
      - run: pnpm install --frozen-lockfile
        working-directory: skills/pedro-best-practices
      # The pedro-best-practices analyzers: pbp-complexity from this checkout, godot-guard as bin/sync pins it.
      # bin/sync also pins a pbp-complexity release; PBP_COMPLEXITY keeps the tests on this checkout's build.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p pbp-complexity
      - run: python3 lib/fleet/binaries.py binaries.json "$RUNNER_TEMP/backup" --apply
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ruff check
      # ci_covers.py parses workflows with PyYAML.
      - run: python3 -m pip install pyyaml
      - run: bin/test
        env:
          PBP_COMPLEXITY: ${{ github.workspace }}/target/release/pbp-complexity
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  file-size:
    name: Max 5k tokens per file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/file-size
