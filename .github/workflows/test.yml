name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # The pedro-best-practices analyzers skip their tests without these.
      - run: pnpm install --frozen-lockfile
        working-directory: skills/pedro-best-practices
      - run: pip install "gdtoolkit==4.*"
      - run: PBP_GDTOOLKIT_PYTHON=$(command -v python3) bin/test
