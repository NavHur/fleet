name: Release pbp-complexity

# Tag pbp-complexity-vX.Y.Z on main to publish the binaries bin/sync installs
# (binaries.json pins each one's sha256).
on:
  push:
    tags: ["pbp-complexity-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml, so the runner builds with the pinned toolchain.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p pbp-complexity
      - name: Package
        run: tar --create --gzip --file "pbp-complexity-${{ matrix.target }}.tar.gz" --directory target/release pbp-complexity
      - uses: actions/upload-artifact@v4
        with:
          name: pbp-complexity-${{ matrix.target }}
          path: pbp-complexity-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries and their checksums to the release
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file dist/SHA256SUMS
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
